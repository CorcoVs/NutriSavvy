<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <title>NutriSavvy</title>
  </head>
  <body>
    <div id="scanner">
      <video id="video" width="400" height="300"></video>
      <canvas id="canvas" width="400" height="300"></canvas>
    </div>
    <br />
    <div class="container">
      <button id="startBtn" type="button">Scan</button>
      <label class="scan-mode">
        <input type="checkbox" id="demoMode" />
        <span>Demo barcode</span>
      </label>
      <div class="feedback">
        <div class="feedback__iconRow" aria-hidden="true">
          <span class="material-symbols-outlined">barcode</span>
        </div>
        <p
          class="feedback__barcode feedback__barcode--empty"
          id="barcodeDisplay"
        >
          No barcode yet
        </p>
      </div>
      <div class="statusContainer">
        <div class="status hidden" role="status"></div>
      </div>
    </div>
    <ul class="result hidden">
      <li class="first--row">
        <img class="product--image hidden" src="" alt="" />
        <div class="product--name"></div>
      </li>
      <li class="nutriscore hidden result-block">
        <img class="nova" src="" alt="" />
      </li>
      <div class="wrapper result-block">
        <img class="nutrigrade hidden" src="" alt="" />
      </div>
      <div class="wrapper result-block">
        <li class="additives hidden">Additives list</li>
      </div>
      <div class="wrapper result-block">
        <li class="ingredients hidden">Ingredients list</li>
      </div>
    </ul>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
